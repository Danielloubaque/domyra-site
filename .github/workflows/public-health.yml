name: Owned sites public health
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: read
concurrency:
  group: public-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public sites and publication freshness
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          sites={
           'Domyra':'https://danielloubaque.github.io/domyra-site/',
           'Vyntriva Tech':'https://vyntriva-tech.onrender.com/',
           'Achopreco':'https://www.xn--achopreo-y0a.com.br/',
           'Steady Income Journal':'https://steadyincomejournal.blogspot.com/',
           'American Civic Brief':'https://americancivicbrief.blogspot.com/'}
          rows=[];failed=False;unverified=False
          for name,url in sites.items():
           item={'site':name,'url':url,'checked_at':datetime.now(timezone.utc).isoformat()}
           try:
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Vyntriva-Owned-Sites-Health/1.0'}),timeout=20) as r:
             content=r.read(2000000).decode('utf-8');item.update(http=r.status,result='reachable',bytes_read=len(content))
            if 'blogspot.com' in url:
             with urllib.request.urlopen(url+'feeds/posts/default?alt=json&max-results=1',timeout=20) as r:feed=json.load(r)
             entries=feed['feed'].get('entry',[])
             if not entries:raise ValueError('No published articles in feed')
             latest=entries[0];published=latest['published']['$t'];age=(datetime.now(timezone.utc)-datetime.fromisoformat(published.replace('Z','+00:00'))).total_seconds()/3600
             item.update(latest_published=published,latest_title=latest['title']['$t'],age_hours=round(age,2))
             if age>30:item['result']='publication_stale_over_30h';failed=True
           except urllib.error.HTTPError as ex:
            item.update(http=ex.code,result='access_unverified' if ex.code in [401,403,429] else 'http_failure')
            if ex.code==404 or ex.code>=500:failed=True
            if ex.code in [401,403,429]:unverified=True
           except Exception as ex:
            item.update(result='check_unverified',error_type=type(ex).__name__);unverified=True
           rows.append(item)
          print(json.dumps({'sites':rows,'confirmed_failure':failed,'verification_incomplete':unverified},ensure_ascii=False,indent=2))
          summary='## Owned sites monitor\n\n| Site | Result | HTTP |\n|---|---|---|\n'+''.join(f'| {r["site"]} | {r["result"]} | {r.get("http","-")} |\n' for r in rows)+'\n403/429 or network errors mean this checker could not verify access; they do not prove an outage. No catalog, publisher or WhatsApp changes were made.\n'
          if os.environ.get('GITHUB_STEP_SUMMARY'):Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          raise SystemExit(1 if failed else 2 if unverified else 0)
          PYCODE
