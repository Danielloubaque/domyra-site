name: Owned sites public health
on:
  workflow_dispatch:
  schedule:
    - cron: '37 */6 * * *'
permissions:
  contents: read
concurrency:
  group: public-health
  cancel-in-progress: false
jobs:
  check:
    name: ${{ matrix.site }} health
    strategy:
      fail-fast: false
      matrix:
        site: [Domyra, Vyntriva Tech, Achopreco, Steady Income Journal, American Civic Brief]
    env:
      TARGET_SITE: ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public sites and publication freshness
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.error,json,os,ssl,socket,time
          from datetime import datetime,timezone
          from pathlib import Path
          sites={
           'Domyra':'https://domyra.net.br/',
           'Vyntriva Tech':'https://vyntriva-tech.onrender.com/',
           'Achopreco':'https://www.xn--achopreo-y0a.com.br/',
           'Steady Income Journal':'https://steadyincomejournal.blogspot.com/',
           'American Civic Brief':'https://americancivicbrief.blogspot.com/'}
          sites={name:url for name,url in sites.items() if name==os.environ['TARGET_SITE']}
          def open_with_retry(url):
           request=urllib.request.Request(url,headers={'User-Agent':'Vyntriva-Owned-Sites-Health/1.1'})
           for attempt in range(3):
            try:return urllib.request.urlopen(request,timeout=20)
            except urllib.error.HTTPError as ex:
             if ex.code not in [429,502,503,504] or attempt==2:raise
            except (TimeoutError,urllib.error.URLError):
             if attempt==2:raise
            time.sleep(2**(attempt+1))
          rows=[];failed=False;unverified=False
          for name,url in sites.items():
           item={'site':name,'url':url,'checked_at':datetime.now(timezone.utc).isoformat()}
           try:
            with open_with_retry(url) as r:
             content=r.read(2000000).decode('utf-8');item.update(http=r.status,result='reachable',bytes_read=len(content))
            if 'blogspot.com' in url:
             with open_with_retry(url+'feeds/posts/default?alt=json&max-results=1') as r:feed=json.load(r)
             entries=feed['feed'].get('entry',[])
             if not entries:raise ValueError('No published articles in feed')
             latest=entries[0];published=latest['published']['$t'];age=(datetime.now(timezone.utc)-datetime.fromisoformat(published.replace('Z','+00:00'))).total_seconds()/3600
             item.update(latest_published=published,latest_title=latest['title']['$t'],age_hours=round(age,2))
             if age>30:item['result']='publication_stale_over_30h';failed=True
           except urllib.error.HTTPError as ex:
            item.update(http=ex.code,result='access_unverified' if ex.code in [401,403,429] else 'http_failure')
            if ex.code==404 or ex.code>=500:failed=True
            if ex.code in [401,403,429]:unverified=True
           except Exception as ex:
            item.update(result='check_unverified',error_type=type(ex).__name__);unverified=True
           rows.append(item)
          for host in (['domyra.net.br','www.domyra.net.br'] if 'Domyra' in sites else []):
           item={'site':'Domyra TLS '+host,'url':'https://'+host+'/'}
           try:
            with socket.create_connection((host,443),timeout=15) as raw:
             with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as tls:
              cert=tls.getpeercert();days=(ssl.cert_time_to_seconds(cert['notAfter'])-datetime.now(timezone.utc).timestamp())/86400
              item.update(result='tls_valid' if days>14 else 'tls_expiring',expires=cert['notAfter'],days_remaining=round(days,1))
              if days<=14:failed=True
           except Exception as ex:item.update(result='tls_failure',error_type=type(ex).__name__);failed=True
           rows.append(item)
          print(json.dumps({'sites':rows,'confirmed_failure':failed,'verification_incomplete':unverified},ensure_ascii=False,indent=2))
          summary='## '+os.environ['TARGET_SITE']+' monitor\n\n| Site | Result | HTTP |\n|---|---|---|\n'+''.join(f'| {r["site"]} | {r["result"]} | {r.get("http","-")} |\n' for r in rows)+'\n403/429 or network errors mean this checker could not verify access; they do not prove an outage. No catalog, publisher or WhatsApp changes were made.\n'
          if os.environ.get('GITHUB_STEP_SUMMARY'):Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(summary)
          if unverified:print('::warning::Some sites could not be verified. See the summary; this is not evidence of an outage.')
          raise SystemExit(1 if failed else 0)
          PYCODE
